name: Update CP Stats

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run script to fetch stats
        run: python3 scripts/fetch_cp_stats.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "mostafa-cse"
          git config --global user.email "mostafakamal.cse2022@gmail.com"
          git add data/cp_stats.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: Update CP stats"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes in CP stats."
          fi
